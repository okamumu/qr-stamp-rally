<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>スタンプラリー</title>
<style>
 :root{ --accent:#1f4e9c; --ok:#2e7d32; --warn:#c0392b; --line:#ddd; }
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f5f7;color:#222;
      line-height:1.7;padding:16px;max-width:640px;margin:0 auto}
 header{text-align:center;padding:8px 0 16px}
 header h1{font-size:20px;color:var(--accent)}
 header p{font-size:13px;color:#666}
 .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
 .count{text-align:center;font-size:15px;color:#555;margin-bottom:6px}
 .count b{font-size:40px;color:var(--accent);vertical-align:-4px}
 .bar{height:12px;background:#e6e8ec;border-radius:6px;overflow:hidden;margin:10px 0 4px}
 .bar > i{display:block;height:100%;background:var(--accent);transition:width .4s}
 ol{list-style:none;margin-top:10px}
 ol li{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px dashed #eee;font-size:15px}
 ol li:last-child{border-bottom:0}
 .chk{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;
      font-size:15px;font-weight:700;color:#fff;background:#c9ccd1}
 li.done .chk{background:var(--ok)}
 li.done span{font-weight:700}
 .goal{border-radius:10px;padding:16px;text-align:center;font-weight:700;font-size:17px}
 .goal.on{background:#e8f5e9;border:2px solid var(--ok);color:#1b5e20}
 .goal.on2{background:#fff8e1;border:2px solid #f9a825;color:#8d6e00}
 .goal.off{background:#f0f1f3;border:1px dashed #bbb;color:#777;font-weight:400;font-size:15px}
 .msg{text-align:center;font-size:17px;font-weight:700;padding:8px 0}
 .msg.ng{color:var(--warn)}
 .how{font-size:14px;color:#555}
 .how li{display:list-item;list-style:decimal inside;border:0;padding:3px 0}
 .foot{font-size:12px;color:#888;text-align:center;padding:10px 0 24px}
 .code{font-family:ui-monospace,monospace;font-size:13px;color:#888}
 .reload{font:inherit;padding:10px 18px;border:1px solid var(--line);background:#fff;
         border-radius:8px;color:var(--accent);font-weight:700;display:block;margin:12px auto 0}
</style>
</head>
<body>
<header>
  <h1>スタンプラリー</h1>
  <p id="evttl"></p>
</header>

<div id="app">
  <div class="card"><div class="msg">読み込んでいます…</div></div>
</div>

<div class="card how">
  <b>回り方</b>
  <ol>
    <li>ブースで<b>展示のご説明を聞いてください</b></li>
    <li>ブースの方が<b>あなたの名札のQRを読み取ります</b>（スマートフォンは不要です）</li>
    <li>規定数のブースを回ったら受付へ。<b>その場で特典</b>を受け取れます<br>
        <span id="needtxt" style="font-size:13px;color:#666"></span></li>
  </ol>
  <p style="margin-top:8px;color:#888;font-size:13px">
    このページは<b>いまいくつ集まったかを見るためのもの</b>です。
    自分の名札のQRを読み取ると、いつでも確認できます。</p>
</div>

<p class="foot">
  うまくいかないときは受付にお声がけください。<br>
  <span id="mycode" class="code"></span>
</p>

<script>
/* 進捗はサーバで管理している。**端末には何も保存しない。**
   iOS のコードスキャナは読み取るたびに使い捨ての領域で開くため、
   端末に保存する方式では続きから数えられなかった（2026-09-17）。 */
const q = new URLSearchParams(location.search);
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));

function card(inner) { return '<div class="card">' + inner + '</div>'; }
function msg(cls, t) { return card('<div class="msg ' + cls + '">' + esc(t) + '</div>'); }

function render(d) {
  const n = d.got.length, all = d.all, pct = Math.min(100, Math.round(n / all * 100));
  let goal;
  const needs = d.needs || [];
  const k = needs.filter(function (x) { return n >= x; }).length;  // 達成した段数
  if (k === 0) {
    goal = '<div class="goal off">あと' + (needs[0] - n) + 'ブースで特典1です</div>';
  } else {
    goal = '<div class="goal ' + (k >= needs.length ? 'on2' : 'on') + '">特典'
         + (needs.length > 1 ? k + 'まで' : 'を') + '達成！<br>受付で<b>特典</b>を受け取れます';
    if (k < needs.length) {
      goal += '<div style="font-weight:400;font-size:14px;margin-top:6px">'
            + 'あと' + (needs[k] - n) + 'ブースで特典' + (k + 1) + 'です</div>';
    }
    goal += '</div>';
  }
  if (needs.length && d.draw >= needs.length) goal += '<div class="goal off" style="margin-top:8px">特典はすべて受け取り済みです</div>';
  else if (d.draw >= 1) goal += '<div class="goal off" style="margin-top:8px">特典' + d.draw + 'まで受け取り済みです</div>';

  let i = 0;
  const list = Object.keys(d.booths).map(function (t) {
    i++;
    const done = d.got.indexOf(t) >= 0;
    return '<li class="' + (done ? 'done' : '') + '"><i class="chk">'
         + (done ? '✓' : i) + '</i><span>' + esc(d.booths[t]) + '</span></li>';
  }).join('');

  app.innerHTML = card(
      '<div class="count"><b>' + n + '</b> / ' + all + ' ブース</div>'
    + '<div class="bar"><i style="width:' + pct + '%"></i></div>'
    + goal + '<ol>' + list + '</ol>'
    + '<button class="reload" type="button" onclick="location.reload()">最新の状態にする</button>');

  document.getElementById('needtxt').textContent =
    needs.map(function (x, i) { return x + 'ブースで特典' + (i + 1); }).join('、');
  document.getElementById('mycode').textContent = '名札コード ' + d.code;
}

const code = (q.get('n') || '').toUpperCase().trim();
if (q.has('b')) {
  app.innerHTML = msg('ng', 'こちらはブースの方が読み取るQRです')
    + card('<p style="font-size:15px;color:#555">'
         + 'スタンプは<b>ブースの方があなたの名札を読み取る</b>方式です。'
         + 'ブースの担当者にお声がけください。<br><br>'
         + '自分の集まり具合は、<b>ご自分の名札のQR</b>を読み取るとご覧いただけます。</p>');
} else if (!/^[2-9A-HJ-NP-Z]{6}$/.test(code)) {
  app.innerHTML = msg('ng', '名札のQRを読み取ってください')
    + card('<p style="font-size:15px;color:#555">'
         + 'お手元の名札にあるQRコードを読み取ると、いまいくつ集まっているかをご覧いただけます。</p>');
} else {
  fetch('status.php?n=' + encodeURIComponent(code) + '&t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.event) { var ev=document.getElementById('evttl'); if (ev) ev.textContent = d.event + (d.date ? '　' + d.date : ''); }
      if (!d.ok) {
        app.innerHTML = msg('ng', d.unregistered ? 'まだ参加登録されていません。受付で名札を見せて参加登録してください' : d.unknown ? 'この名札は無効です' : '読み取れませんでした')
          + card('<p style="font-size:15px;color:#555">受付にお声がけください。</p>');
        return;
      }
      render(d);
    })
    .catch(function () {
      app.innerHTML = msg('ng', '通信できませんでした')
        + card('<p style="font-size:15px;color:#555">'
             + '電波の良い場所で、もう一度お試しください。<br>'
             + 'スタンプ自体はブースの方の読み取りで記録されていますので、失われることはありません。</p>'
             + '<button class="reload" type="button" onclick="location.reload()">もう一度</button>');
    });
}
</script>
</body>
</html>
